services:
  - type: web
    name: sofia-tarot
    runtime: static
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false

    buildCommand: npm install && npm run build

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      - path: /*
        name: Cache-Control
        value: "public, max-age=3600"
      - path: "/*.css"
        name: Cache-Control
        value: "public, max-age=86400"
      - path: "/*.js"
        name: Cache-Control
        value: "public, max-age=86400"
